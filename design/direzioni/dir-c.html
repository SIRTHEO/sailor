<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>C</title><style>
:root{
  --ink:#1f1a11; --muted:#59544e; --bg:#fdf8f0; --surface:#f3eee6; --line:#e3ddd6;
  --state-broke:#972620; --state-capped:#764b09; --state-human:#663e8e;
  --display:"SuperClarendon","Rockwell",serif; --data:"Menlo",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px}
.row{display:grid;grid-template-columns:1fr 260px 130px 150px;align-items:center;
     gap:24px;height:96px;padding:0 40px;border-bottom:1px solid var(--line)}
.name{font-size:34px;font-weight:900;letter-spacing:-.01em}
.st{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.st.quiet{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.num{font-family:var(--data);font-size:26px;text-align:right}
.num.quiet{color:var(--muted)}
.foot{display:flex;gap:32px;padding:20px 40px;font-size:20px;color:var(--muted);
      background:var(--surface)}
.more{padding:14px 40px;font-size:16px;color:var(--muted);border-bottom:1px solid var(--line)}
</style></head><body>

<div class="row"><div class="name">esamina-la-repo</div>
  <div class="st" style="color:var(--state-human)">aspetta te</div>
  <div class="num">31 m</div><div class="num">1,204 $</div></div>

<div class="row"><div class="name">chiedi-all-indice</div>
  <div class="st" style="color:var(--state-broke)">rotto</div>
  <div class="num">2 m</div><div class="num quiet">0,000 $</div></div>

<div class="row"><div class="name">smista-il-lavoro</div>
  <div class="st" style="color:var(--state-capped)">fermo al tetto</div>
  <div class="num">8 m</div><div class="num">0,200 $</div></div>

<div class="row"><div class="name">sviluppa-sailor</div>
  <div class="st quiet">in corso</div>
  <div class="num">14 m</div><div class="num">0,412 $</div></div>

<div class="row"><div class="name">costruisci-una-pagina</div>
  <div class="st quiet">in attesa</div>
  <div class="num">3 m</div><div class="num quiet">0,024 $</div></div>

<div class="row"><div class="name">relay</div>
  <div class="st quiet">in corso</div>
  <div class="num">47 s</div><div class="num quiet">0,003 $</div></div>

<div class="more">altre 9 &nbsp;·&nbsp; ⌘K</div>
<div class="foot"><span>oggi: 14 andate · 2 rotte · 1,84 $</span></div>
</body></html>
