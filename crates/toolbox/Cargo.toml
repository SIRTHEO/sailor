[package]
name = "toolbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Answers "what can I use here?": which command lines, which MCP servers and
# which other tools exist on this machine. The list of what to look for is data
# — the descriptors — and not code: no particular tool name appears in here.
#
# `actions` for the timeout primitive (`run_with_timeout`): asking a binary its
# version means running it, and a binary that does not return must not stop a
# detection. `inventory` for `discovery::glob`, which already matches `*`
# patterns without pulling in another crate. `flow` for the `Action` trait, so a
# flow step can ask for the detection. `ledger` for `sailor_home()` and nothing
# else: only one place knows where Sailor's home is, and rewriting the rule here
# would have `tool_needs` look in a different directory from the one the window
# searches for flows. It adds nothing to the build — it already came in through
# `actions`.
[dependencies]
actions = { path = "../actions" }
flow = { path = "../flow" }
ledger = { path = "../ledger" }
inventory = { path = "../inventory" }
serde = { workspace = true }
serde_json = { workspace = true }

# For the tests only, and for one of them: the one that takes the shipped
# descriptor, gives it a real engine output and checks that the cost coming out
# is the one the engine itself declared. Without the price list in here that
# chain could only be tested piecewise — and the pieces passed even when they
# did not touch. It is not part of what ships.
[dev-dependencies]
models = { path = "../models" }
