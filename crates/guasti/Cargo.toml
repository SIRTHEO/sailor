[package]
name = "guasti"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Nessuna dipendenza di proposito: questo comando gira dentro un giro di prove
# che ripete la batteria decine di volte, e ogni secondo di compilazione in piu'
# si paga a ogni riavvio. Tutto quello che serve — diff, copia, processi — sta
# nella libreria standard.
[dependencies]

[[bin]]
name = "guasti"
path = "src/main.rs"
