[package]
name = "terminal"
version = "0.1.0"
description = "The pseudo-terminal engine: open one in a workspace, write, read, resize, close."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No dependency on the window, and that is the point: no Tauri, no `desktop/`,
# no element of an interface. The engine is tested with `cargo test -p
# terminal`, and the window attaches on top instead of containing it.
# `libc` is the only external dependency: `posix_openpt`, `grantpt`,
# `unlockpt` and `ptsname` are POSIX, and the crate was already in the lock
# file, so nothing new is downloaded or built. A pty abstraction would bring
# a dozen crates for a Windows layer that is not used here.
[dependencies]
# For `Machine` (expanding `~` and `$VAR`, finding Sailor's home, solved there
# once) and for `probe::look_up`, the guard of the dispatch: whether a word is
# an executable on this machine, with «do not know» as an answer.
toolbox = { path = "../toolbox" }
# `sessions` for one thing: the estimate of how many tokens the bytes moved
# amount to. The row of the list carries it, so the window and `terminal list`
# read the same number from the same model instead of each fitting their own.
sessions = { path = "../sessions" }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

# Only for the test that ties the dispatch to a flow: a dispatched request
# becomes the signal of the manual trigger, and downstream steps read it. The
# tie is tested but not shipped: the terminal engine must depend neither on
# flows nor on triggers to open a terminal.
[dev-dependencies]
trigger = { path = "../trigger" }
flow = { path = "../flow" }
