[package]
name = "registry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# QUALI AZIONI SA ESEGUIRE SAILOR: una funzione sola, e il crate esiste per
# quello.
#
# Non porta logica propria e non aggiunge nessuna dipendenza esterna: mette
# insieme quelle che c'erano già. Esiste perché la stessa lista era scritta due
# volte — una nel comando `sailor flow run`, una nel guscio della finestra — e le
# due copie si sono disallineate almeno tre volte, l'ultima il 30/08/2026 alle
# 09:05, quando la misura del consumo è entrata da una parte sola. Il commento
# sopra la copia della finestra diceva testualmente «QUESTA LISTA SI DISALLINEA,
# E L'HA GIÀ FATTO»: era vero, ed è rimasto vero finché la lista è stata due.

[dependencies]
actions = { path = "../actions" }
flow = { path = "../flow" }
ledger = { path = "../ledger" }
toolbox = { path = "../toolbox" }
trigger = { path = "../trigger" }
# The relay's nodes. A crate of their own because they reach a live terminal,
# and `terminal` sits downstream of `actions` in the graph.
relay = { path = "../relay" }

# SOLO PER LE PROVE, e la riga sopra resta vera: il crate spedito non porta
# nessuna dipendenza esterna propria. Qui serve a scrivere un flusso a mano nel
# corpo di una prova, a costruire l'ingresso di un passo e a rileggere la
# proiezione del deposito — cose che si scrivono in JSON perché è in JSON che
# vivono.
#
# UNA SEZIONE SOLA, E STA IN FONDO. Il 31/08/2026 due rami hanno aggiunto
# ciascuno la propria `[dev-dependencies]`, in due punti diversi del file: git
# le ha fuse senza vedere nessun conflitto, e cargo ha rifiutato l'intero
# workspace con «duplicate key». Un manifesto TOML non ha una prova che lo
# guardi: la difesa è tenerne una sola, qui.
[dev-dependencies]
serde_json = { workspace = true }
