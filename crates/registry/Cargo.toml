[package]
name = "registry"
version = "0.1.0"
description = "The one list of actions the engine and the window share."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# One function, and the crate exists for it: which actions Sailor can run.
# No logic of its own and no external dependency; it assembles the ones that
# were there. The same list was written twice, in `sailor flow run` and in
# the window's shell, and the two copies drifted apart more than once.

[dependencies]
actions = { path = "../actions" }
# Where a sentence for a person is written, in both languages: the reason a run
# stopped is shown by the window and by the command line alike.
catalogue = { path = "../catalogue" }
flow = { path = "../flow" }
faults = { path = "../faults" }
ledger = { path = "../ledger" }
# Where the terminals Sailor tracks live: only the path is taken from here,
# and one place knows it.
sessions = { path = "../sessions" }
toolbox = { path = "../toolbox" }
trigger = { path = "../trigger" }
# The relay's nodes. A crate of their own because they reach a live terminal,
# and `terminal` sits downstream of `actions` in the graph.
relay = { path = "../relay" }

# Tests only, so the shipped crate still brings no external dependency of its
# own: a flow written by hand in a test body, a step's input, the store's
# projection read back, all of them JSON because that is where they live.
# One section, and it sits last: two branches once each added their own
# `[dev-dependencies]` in two places, git merged them without a conflict,
# and cargo refused the whole workspace with «duplicate key».
[dev-dependencies]
serde_json = { workspace = true }
