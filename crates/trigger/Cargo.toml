[package]
name = "trigger"
version = "0.1.0"
description = "Where the signal that starts a flow comes from."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The list of sources is data, the descriptors, not code: no terminal, product
# or machine is named in here. No dependency on `actions`: a trigger runs
# nothing.
[dependencies]
# For the `Action` trait, so a trigger is a step like any other.
flow = { path = "../flow" }
# For `Machine`: expanding `~`, `$VAR` and `*` is solved there once, and a
# second implementation would diverge from the first unnoticed.
toolbox = { path = "../toolbox" }
serde = { workspace = true }
serde_json = { workspace = true }
