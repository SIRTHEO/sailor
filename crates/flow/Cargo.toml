[package]
name = "flow"
version = "0.1.0"
description = "The flow engine: graph, parallel fronts, spending cap, resume."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
catalogue = { path = "../catalogue" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

# The real store enters only in tests, and the direction is deliberate:
# `ledger` implements `RecordStore` for `Ledger`, so as a normal dependency it
# would be a cycle cargo refuses. A test-only cycle is allowed, and it is the
# one place that proves the executor sees the spend rise while a run is
# going, which is the only instant the cap works or does not.
[dev-dependencies]
ledger = { path = "../ledger" }
