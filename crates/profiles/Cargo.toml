[package]
name = "profiles"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Profili multipli per riga di comando, con o senza il suo supporto nativo.
# Dipendenze già in uso nel resto dell'albero: niente da scaricare in più.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "profiles"
path = "src/main.rs"
