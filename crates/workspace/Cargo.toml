[package]
name = "workspace"
version = "0.1.0"
description = "The tree being worked in: its root, what it declares, and its worktrees."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The flows a tree owns and the ones it does not, and the register of
# projects: the column has to draw both, and a second reader of those files
# would answer differently from the one that runs them.
flow = { path = "../flow" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
