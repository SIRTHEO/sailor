[package]
name = "workspace"
version = "0.1.0"
description = "The tree being worked in: its root, what it declares, and its worktrees."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The flows a tree owns and the ones it does not, and the register of
# projects: the column has to draw both, and a second reader of those files
# would answer differently from the one that runs them.
flow = { path = "../flow" }
serde = { workspace = true }
serde_json = { workspace = true }
# The identity a code index keeps for a tree is a hash of its path, computed
# here exactly as the index computes it, so closing a tree can name it.
sha2 = "0.10"
