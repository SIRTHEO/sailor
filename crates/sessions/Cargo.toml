[package]
name = "sessions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Terminal tracking: who announced themselves, on which tty, in which worktree,
# and what is on the machine right now.
#
# **ITS OWN CRATE, AND ITS OWN SQLite FILE.** Terminal sessions are not flow
# runs: another key, another lifecycle, another reason to change. Keeping them
# in `state.db` would mean raising `PROJECTION_SCHEMA_VERSION` — a number two
# parallel work-streams would each raise to their own next value, and the
# divergence would give no error at all: the store of whoever arrives second
# would declare itself an unsupported version on a machine where nothing had
# changed. Here the version is ours and interferes with nobody.
#
# `ledger` is here for one function, `default_directory()`: where this machine's
# store lives. Copying that path out is fault 19 — the home in two places, with
# neither of the two declaring itself the wrong one.
#
# `libc` is here for `ttyname`: a question about this process's own descriptor
# rather than about the machine, so it never goes through `ps` and cannot be
# denied silently.
[dependencies]
ledger = { path = "../ledger" }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Only for the test that writes a `user_version` higher than ours by hand and
# checks the file is refused by name: without writing it by hand, nobody walks
# that branch until it is too late.
[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
