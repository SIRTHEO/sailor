[package]
name = "sessions"
version = "0.1.0"
description = "The terminals Sailor tracks: who announced themselves, where, and what runs now."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Its own crate, and its own SQLite file. Terminal sessions are not flow
# runs: another key, another lifecycle, another reason to change. Keeping
# them in `state.db` would mean raising `PROJECTION_SCHEMA_VERSION`, a number
# two parallel work-streams would each raise to their own next, and the store
# of whoever arrives second would declare itself unsupported on a machine
# where nothing had changed. Here the version is ours.
[dependencies]
# For one function, `default_directory()`: where this machine's store lives.
# Copying that path out is fault 19.
ledger = { path = "../ledger" }
# For `ttyname`: a question about this process's own descriptor rather than
# about the machine, so it never goes through `ps` and cannot be denied silently.
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Only for the test that writes a `user_version` higher than ours by hand and
# checks the file is refused by name: without writing it by hand, nobody walks
# that branch until it is too late.
[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
