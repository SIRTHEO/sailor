[package]
name = "supervisor"
version = "0.1.0"
description = "Keeps the window alive while the machine beneath it is rebuilt."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ledger = { path = "../ledger" }
machine = { path = "../machine" }
serde = { workspace = true }
serde_json = { workspace = true }

# To kill a process group rather than one process: a child that started
# something left it alive, and that is the port that stays busy.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tests only: the receipt a judge hands to `sailor ratchet`. `workspace`
# depends on nothing of this workspace, so nothing of it reaches the crate.
[dev-dependencies]
workspace = { path = "../workspace" }

# The program that replaces `cargo tauri dev` in live mode.
[[bin]]
name = "sailor-live"
path = "src/main.rs"
