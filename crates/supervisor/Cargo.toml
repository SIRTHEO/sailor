[package]
name = "supervisor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Tiene accesa la finestra mentre si aggiusta la macchina di sotto."

[dependencies]
ledger = { path = "../ledger" }
serde = { workspace = true }
serde_json = { workspace = true }

# Per uccidere un gruppo di processi invece di un processo solo: un figlio che
# ha acceso qualcuno lo lasciava vivo, ed è la porta che resta occupata.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Il programma che sostituisce `cargo tauri dev` in modalità viva.
[[bin]]
name = "sailor-live"
path = "src/main.rs"
