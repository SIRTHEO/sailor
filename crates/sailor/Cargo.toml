[package]
name = "sailor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# `release` è diventato solo libreria (bersagli, timbro, prontezza del
# servizio): questo crate assorbe i gesti — I/O e processi — che prima stavano
# nel suo `main.rs`, così un rilascio si invoca da `sailor release`, non da un
# per sapere se il pid di una ricevuta è ancora vivo. `profiles`, `models` e
# `ui` sono arrivati il 27/08/2026 con lo stesso schema: la libreria decide,
# `sailor` fa i gesti.
[dependencies]
# The sentences this command line says, in the two languages, so the shipped
# product speaks English and whoever wants Italian sets one variable. Not a
# convenience: the prose used to live inside `format!`, where a second language
# has nowhere to go.
catalogue = { path = "../catalogue" }
workspace = { path = "../workspace" }
release = { path = "../release" }
profiles = { path = "../profiles" }
models = { path = "../models" }
ui = { path = "../ui" }
actions = { path = "../actions" }
faults = { path = "../faults" }
flow = { path = "../flow" }
ledger = { path = "../ledger" }
inventory = { path = "../inventory" }
# Il rilevamento di cosa c'è sulla macchina — CLI, server MCP, strumenti — che un
# passo di flusso può chiedere con l'azione `detect_tools`, e che qui risolve gli
# strumenti nominati dai passi. `trigger` porta il nodo di ingresso: da dove
# arriva il segnale che fa partire un flusso.
toolbox = { path = "../toolbox" }
trigger = { path = "../trigger" }
# Quali azioni sa eseguire Sailor: una lista sola, condivisa con la finestra.
# Averla in due copie ha fatto girare lo stesso flusso in due modi diversi.
registry = { path = "../registry" }
# Il tracciamento dei terminali: `sailor session` è solo i gesti — leggere
# standard input, chiedere il proprio tty, stampare — mentre l'ancora, il
# deposito delle sessioni e il censimento stanno lì, dove si provano senza
# passare dalla riga di comando.
sessions = { path = "../sessions" }
# The pseudo-terminal engine. `sailor terminal` owns the descriptor a session
# runs on, which is the only way to type into one without knowing which
# emulator drew the window.
terminal = { path = "../terminal" }
# Only to duplicate the two descriptors this process was handed: a terminal
# bridge reads its own standard input instead of the buffered wrapper.
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
