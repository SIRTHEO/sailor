[package]
name = "sailor"
version = "0.1.0"
description = "The command line of Sailor: flows, engines, profiles, quota and the ledger, from one binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The library crates decide; this one makes the gestures, I/O and processes.
[dependencies]
# The sentences this command line says, in the two languages, so the shipped
# product speaks English and whoever wants Italian sets one variable. Not a
# convenience: the prose used to live inside `format!`, where a second language
# has nowhere to go.
catalogue = { path = "../catalogue" }
workspace = { path = "../workspace" }
release = { path = "../release" }
profiles = { path = "../profiles" }
models = { path = "../models" }
ui = { path = "../ui" }
actions = { path = "../actions" }
faults = { path = "../faults" }
flow = { path = "../flow" }
ledger = { path = "../ledger" }
machine = { path = "../machine" }
inventory = { path = "../inventory" }
# What this machine has (command lines, MCP servers, tools), which a step asks
# for with `detect_tools` and which resolves the tools steps name. `trigger`
# brings the entry node: where the signal that starts a flow comes from.
toolbox = { path = "../toolbox" }
trigger = { path = "../trigger" }
# Which actions Sailor can run: one list, shared with the window. Two copies
# of it once ran the same flow in two different ways.
registry = { path = "../registry" }
# Terminal tracking: `sailor session` is only the gestures (read standard
# input, ask for its own tty, print), while the anchor, the session store and
# the census live there, where they are tested without the command line.
sessions = { path = "../sessions" }
# The pseudo-terminal engine. `sailor terminal` owns the descriptor a session
# runs on, which is the only way to type into one without knowing which
# emulator drew the window.
terminal = { path = "../terminal" }
# Only to duplicate the two descriptors this process was handed: a terminal
# bridge reads its own standard input instead of the buffered wrapper.
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
