[package]
name = "sailor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# `release` è diventato solo libreria (bersagli, timbro, prontezza del
# servizio): questo crate assorbe i gesti — I/O e processi — che prima stavano
# nel suo `main.rs`, così un rilascio si invoca da `sailor release`, non da un
# binario a parte. `notte` serve allo stesso gesto di prima, `process_exists`,
# per sapere se il pid di una ricevuta è ancora vivo. `profiles`, `models` e
# `ui` sono arrivati il 27/08/2026 con lo stesso schema: la libreria decide,
# `sailor` fa i gesti.
[dependencies]
release = { path = "../release" }
notte = { path = "../notte" }
profiles = { path = "../profiles" }
models = { path = "../models" }
ui = { path = "../ui" }
actions = { path = "../actions" }
flow = { path = "../flow" }
ledger = { path = "../ledger" }
inventory = { path = "../inventory" }
# Il rilevamento di cosa c'è sulla macchina — CLI, server MCP, strumenti — che un
# passo di flusso può chiedere con l'azione `detect_tools`, e che qui risolve gli
# strumenti nominati dai passi. `trigger` porta il nodo di ingresso: da dove
# arriva il segnale che fa partire un flusso.
toolbox = { path = "../toolbox" }
trigger = { path = "../trigger" }
serde = { workspace = true }
serde_json = { workspace = true }
