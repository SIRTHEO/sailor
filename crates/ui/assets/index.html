<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sailor — flussi</title>
<style>
  :root {
    --bg: #f6f6f4;
    --fg: #1c1d20;
    --muted: #5b5f66;
    --card: #ffffff;
    --border: #e1e1de;
    --accent: #2f6f4f;
    --warn: #a8402f;
    --open: #9a6b12;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a;
      --fg: #eceef2;
      --muted: #9aa0ab;
      --card: #1d1f24;
      --border: #2b2e35;
      --accent: #63c294;
      --warn: #e2897a;
      --open: #e0b45c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 68rem; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); font-size: 0.85rem; font-family: var(--mono); }
  h2 { font-size: 1rem; margin: 0 0 0.75rem; }
  section { margin-bottom: 2.25rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.75rem;
  }
  .empty { color: var(--muted); font-style: italic; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; }
  code, .mono { font-family: var(--mono); font-size: 0.85em; }
  .badge {
    display: inline-block;
    padding: 0.05rem 0.45rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-family: var(--mono);
    border: 1px solid var(--border);
  }
  .badge.open { color: var(--open); border-color: var(--open); }
  .badge.broke { color: var(--warn); border-color: var(--warn); }
  .badge.went { color: var(--accent); border-color: var(--accent); }
  ul.steps { margin: 0; padding-left: 1.1rem; }
  ul.steps li { margin-bottom: 0.2rem; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.82rem; }
  .flow-steps { margin: 0.4rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; }
  .flow-steps li { margin-bottom: 0.3rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sailor — flussi</h1>
    <div class="sub" id="subtitle">caricamento…</div>
  </header>

  <section>
    <h2>I flussi che esistono</h2>
    <div id="flows"></div>
  </section>

  <section>
    <h2>Stato di adesso</h2>
    <div id="open-steps"></div>
  </section>

  <section>
    <h2>Storia delle esecuzioni</h2>
    <div id="executions"></div>
  </section>
</main>

<script>
function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function fmtWhen(seconds) {
  if (seconds === null || seconds === undefined) return '—';
  return new Date(seconds * 1000).toLocaleString();
}

function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined) return 'in corso';
  if (seconds < 60) return `${seconds}s`;
  const minutes = Math.floor(seconds / 60);
  const rest = seconds % 60;
  if (minutes < 60) return `${minutes}m ${rest}s`;
  const hours = Math.floor(minutes / 60);
  return `${hours}h ${minutes % 60}m`;
}

function fmtCost(micros) {
  return `$${(micros / 1_000_000).toFixed(4)}`;
}

function fmtTokens(totals) {
  return `${totals.input_tokens} in · ${totals.output_tokens} out · ${totals.cached_tokens} cache`;
}

function renderFlows(flows) {
  const el = document.getElementById('flows');
  if (flows.length === 0) {
    el.innerHTML = '<p class="empty">Nessun flusso è registrato in questa pagina: nessun file *.json in --flows-dir descrive ancora un flow::Graph.</p>';
    return;
  }
  el.innerHTML = flows.map(flow => `
    <div class="card">
      <strong class="mono">${escapeHtml(flow.name)}</strong>
      <ul class="flow-steps">
        ${flow.steps.map(step => `
          <li>
            <code>${escapeHtml(step.id)}</code>
            ${step.deps.length ? `← ${step.deps.map(d => `<code>${escapeHtml(d)}</code>`).join(', ')}` : '<span class="mono">(radice)</span>'}
            — azione <code>${escapeHtml(step.action)}</code>,
            ${step.max_attempts} tentativ${step.max_attempts === 1 ? 'o' : 'i'}
            ${step.conditional ? '<span class="badge open">condizionale</span>' : ''}
          </li>
        `).join('')}
      </ul>
    </div>
  `).join('');
}

function renderOpenSteps(payload) {
  const el = document.getElementById('open-steps');
  if (!payload.ledger_present) {
    el.innerHTML = `<p class="empty">Il deposito <code class="mono">${escapeHtml(payload.ledger_dir)}</code> non esiste ancora: nessun flusso è mai girato su questa macchina.</p>`;
    return;
  }
  const withOpen = payload.executions.filter(e => e.steps_open.length > 0);
  if (withOpen.length === 0) {
    el.innerHTML = '<p class="empty">Nessun passo è aperto adesso.</p>';
    return;
  }
  el.innerHTML = withOpen.map(execution => `
    <div class="card">
      <strong class="mono">${escapeHtml(execution.run_id)}</strong>
      <span class="sub">${escapeHtml(execution.kind)} · ${escapeHtml(execution.entity)}</span>
      <ul class="steps">
        ${execution.steps_open.map(step => `
          <li><code>${escapeHtml(step.step_id)}</code> — tentativo ${step.attempt}, aperto da ${fmtDuration(step.open_for_secs)}</li>
        `).join('')}
      </ul>
    </div>
  `).join('');
}

function renderExecutions(payload) {
  const el = document.getElementById('executions');
  if (!payload.ledger_present) {
    el.innerHTML = `<p class="empty">Il deposito <code class="mono">${escapeHtml(payload.ledger_dir)}</code> non esiste: nessuna esecuzione da mostrare finché un flusso non gira almeno una volta.</p>`;
    return;
  }
  if (payload.executions.length === 0) {
    el.innerHTML = '<p class="empty">Il deposito esiste ma non contiene ancora nessuna esecuzione.</p>';
    return;
  }
  const rows = payload.executions.map(execution => {
    const models = Object.entries(execution.tokens_by_model)
      .map(([model, totals]) => `<div><code>${escapeHtml(model)}</code>: ${fmtTokens(totals)} · ${fmtCost(totals.cost_micros)}</div>`)
      .join('');
    const calls = execution.calls.map(call => `
      <tr>
        <td class="mono">${escapeHtml(call.call_id)}</td>
        <td>${escapeHtml(call.step_id ?? '—')}</td>
        <td>${escapeHtml(call.purpose)}</td>
        <td class="mono">${escapeHtml(call.requested_model)} → ${escapeHtml(call.actual_model)}</td>
        <td>${fmtTokens(call)}</td>
        <td>${fmtCost(call.cost_micros)}</td>
      </tr>
    `).join('');
    return `
      <div class="card">
        <table style="margin-bottom:0.5rem">
          <tbody>
            <tr>
              <td><strong class="mono">${escapeHtml(execution.run_id)}</strong><br><span class="sub">${escapeHtml(execution.kind)} · ${escapeHtml(execution.entity)}</span></td>
              <td>${escapeHtml(execution.status)}${execution.error ? `<br><span style="color:var(--warn)">${escapeHtml(execution.error)}</span>` : ''}</td>
              <td>iniziata ${fmtWhen(execution.started_at)}<br>durata ${fmtDuration(execution.duration_secs)}</td>
              <td>
                <span class="badge went">${execution.steps_went} andati</span>
                ${execution.steps_broke ? `<span class="badge broke">${execution.steps_broke} rotti</span>` : ''}
                ${execution.steps_open.length ? `<span class="badge open">${execution.steps_open.length} aperti</span>` : ''}
              </td>
              <td>${fmtTokens(execution.tokens)}<br>${fmtCost(execution.tokens.cost_micros)} totali</td>
            </tr>
          </tbody>
        </table>
        ${models ? `<div class="sub" style="margin-bottom:0.5rem">${models}</div>` : ''}
        ${execution.calls.length ? `
          <details>
            <summary>${execution.calls.length} chiamate al modello</summary>
            <table>
              <thead><tr><th>Chiamata</th><th>Passo</th><th>Scopo</th><th>Modello</th><th>Token</th><th>Costo</th></tr></thead>
              <tbody>${calls}</tbody>
            </table>
          </details>
        ` : ''}
      </div>
    `;
  }).join('');
  el.innerHTML = rows;
}

async function load() {
  const subtitle = document.getElementById('subtitle');
  try {
    const response = await fetch('/api/dashboard');
    if (!response.ok) throw new Error(`risposta ${response.status}`);
    const payload = await response.json();
    subtitle.textContent = `deposito: ${payload.ledger_dir} · aggiornato ${fmtWhen(payload.generated_at)}`;
    renderFlows(payload.flows);
    renderOpenSteps(payload);
    renderExecutions(payload);
  } catch (error) {
    subtitle.textContent = `non riesco a leggere /api/dashboard: ${error}`;
  }
}

load();
</script>
</body>
</html>
