[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Nessuna dipendenza in più: la pagina serve solo `flow`/`ledger` (già nel
# deposito) e un servitore scritto a mano su `TcpListener`, coerente con la
# scelta del resto del workspace di tenere le dipendenze al minimo.
[dependencies]
flow = { path = "../flow" }
ledger = { path = "../ledger" }
serde = { workspace = true }
serde_json = { workspace = true }
