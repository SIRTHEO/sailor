[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# No extra dependencies: this crate needs only `flow` and `ledger`, which the
# ledger already brings in, in keeping with the rest of the workspace holding
# its dependencies to a minimum.
[dependencies]
flow = { path = "../flow" }
ledger = { path = "../ledger" }
inventory = { path = "../inventory" }
serde = { workspace = true }
serde_json = { workspace = true }
