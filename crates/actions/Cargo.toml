[package]
name = "actions"
version = "0.1.0"
description = "What a step can do, and how an external engine is invoked."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Actions any `flow::Graph` can run: no queue, no path, no service, only the
# engine that runs them and the crates below. Every arrow here points down:
# `models` and `profiles` depend on nothing of this crate, so there is no
# cycle, while the reverse arrow to `toolbox` would be one.
[dependencies]
# A tree kept because it holds work is a line a person reads, so it is read
# from the catalogue like every other. No cycle: `catalogue` depends on serde.
catalogue = { path = "../catalogue" }
flow = { path = "../flow" }
faults = { path = "../faults" }
ledger = { path = "../ledger" }
# Reading the usage an engine declares and pricing it from a list are written
# there once; a second copy of a price rule diverges from the first.
models = { path = "../models" }
# The environment overlay that points an engine at Sailor's home: an engine a
# step starts must read the same home as `sailor run`, or two runs of one
# flow are not the same measurement. See fault 18.
profiles = { path = "../profiles" }
serde = { workspace = true }
serde_json = { workspace = true }
# Whoever watches the crew reads the terminals Sailor tracks, not only the
# claims agents write. No cycle: `sessions` depends only on `ledger`.
sessions = { path = "../sessions" }
# Cutting a step its own tree is git's job, and the one place that talks to
# git worktrees already lives here. No cycle: this crate depends on serde.
workspace = { path = "../workspace" }

# To kill a process group rather than one process: `libc::kill` with a
# negative pid. Already a dependency of `ledger`, `sessions` and `terminal`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# One reader of the `model_calls` projection, and only in tests. A private
# copy of `ui::parse::parse_model_call_row` lived here once; two readers that
# err together stay green together. `ledger::MODEL_CALL_DUMP_COLUMNS` keeps
# the one reader honest, and cargo allows a test-only cycle.
[dev-dependencies]
ui = { path = "../ui" }
