[package]
name = "faults"
version = "0.1.0"
description = "The fault ledger: every defect met, how it showed, and what would have stopped it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Data, not a document. A fault number was a shared resource nobody guarded,
# and no test can guard it either, because a test looks at one branch at a
# time. The store is one, and it hands out the number.
# Its own SQLite file, like `sessions` and for the same reason: the version is
# ours and does not touch the ledger's `PROJECTION_SCHEMA_VERSION`, which two
# parallel branches would each raise to their own next.
[dependencies]
ledger = { path = "../ledger" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Tests only: the receipt a judge hands to `sailor ratchet`. `workspace`
# depends on nothing of this workspace, so nothing of it reaches the crate.
[dev-dependencies]
workspace = { path = "../workspace" }
