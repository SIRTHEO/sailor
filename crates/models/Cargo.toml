[package]
name = "models"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde_json.workspace = true
# `regex` serves the `text` shape of declared consumption: an engine that
# states its own tokens in plain text instead of JSON is read with an
# expression written in the descriptor, not with a code branch for that engine.
# It adds nothing to the workspace build — `inventory` already pulls it in.
regex.workspace = true
