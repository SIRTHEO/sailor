[package]
name = "models"
version = "0.1.0"
description = "Catalogue, price list and remaining quota of the models."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ledger = { path = "../ledger" }
serde.workspace = true
serde_json.workspace = true
# `regex` serves the `text` shape of declared consumption: an engine that
# states its own tokens in plain text instead of JSON is read with an
# expression written in the descriptor, not with a code branch for that engine.
# It adds nothing to the workspace build — `inventory` already pulls it in.
regex.workspace = true
