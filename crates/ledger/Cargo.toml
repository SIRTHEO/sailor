[package]
name = "ledger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
flow = { path = "../flow" }
# Only for `kill(pid, 0)`: asking whether **one** known pid still exists. Not a
# shortcut to `ps` — the opposite. Inside some sandboxes `pgrep` sees nothing and
# **answers empty without an error**, returning the same thing when nobody is
# there and when it is not allowed to look. A syscall about a single pid has no
# such shape: it returns a yes, a no, or a readable error.
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"

