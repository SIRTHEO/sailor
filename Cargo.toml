[workspace]
resolver = "2"
members = ["crates/flow", "crates/ledger", "crates/release", "crates/profiles", "crates/models", "crates/ui", "crates/sailor", "crates/actions", "crates/inventory", "crates/toolbox", "crates/trigger", "crates/registry", "crates/terminal"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

# Dipendenze tenute al minimo di proposito: ogni crate in più è tempo di
# compilazione e superficie da aggiornare, e questi binari devono partire in
# pochi millisecondi — è l'unica ragione per cui esistono.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` non è un dettaglio di gusto: senza, il parsing di un
# `1787052662.1803281` torna indietro come `1787052662.180328` — mezzo ULP, ma
# basta a far divergere ogni confronto col Python su un istante letto e
# riscritto, e i file di stato passano da tutti e due.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
