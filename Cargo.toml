[workspace]
resolver = "2"
# One per line, alphabetical, and both halves matter. On one line every new
# crate touches the same line, so two branches adding two different crates
# conflict by construction. Appending at the end only moves the collision to
# the last line. Alphabetical puts two additions on two different lines, and
# git merges them without asking.
members = [
    "crates/actions",
    "crates/faults",
    "crates/flow",
    "crates/inventory",
    "crates/ledger",
    "crates/models",
    "crates/profiles",
    "crates/registry",
    "crates/release",
    "crates/sailor",
    "crates/sessions",
    "crates/supervisor",
    "crates/terminal",
    "crates/toolbox",
    "crates/trigger",
    "crates/ui",
    "crates/workspace",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"

# Dipendenze tenute al minimo di proposito: ogni crate in più è tempo di
# compilazione e superficie da aggiornare, e questi binari devono partire in
# pochi millisecondi — è l'unica ragione per cui esistono.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` non è un dettaglio di gusto: senza, il parsing di un
# `1787052662.1803281` torna indietro come `1787052662.180328` — mezzo ULP, ma
# basta a far divergere ogni confronto col Python su un istante letto e
# riscritto, e i file di stato passano da tutti e due.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
