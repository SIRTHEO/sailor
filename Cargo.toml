[workspace]
resolver = "2"
# One per line, alphabetical, and both halves matter. On one line every new
# crate touches the same line, so two branches adding two different crates
# conflict by construction. Appending at the end only moves the collision to
# the last line. Alphabetical puts two additions on two different lines, and
# git merges them without asking.
members = [
    "crates/actions",
    "crates/catalogue",
    "crates/faults",
    "crates/flow",
    "crates/inventory",
    "crates/ledger",
    "crates/models",
    "crates/profiles",
    "crates/registry",
    "crates/relay",
    "crates/release",
    "crates/sailor",
    "crates/sessions",
    "crates/supervisor",
    "crates/terminal",
    "crates/toolbox",
    "crates/trigger",
    "crates/ui",
    "crates/workspace",
]

# Every member inherits these. `publish = false` is a statement, not a guard:
# these crates are installed from the tree with `cargo install --path`, and
# none of them is on a registry.
[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SIRTHEO/sailor"
publish = false

# Dependencies are held to a minimum on purpose: every extra crate is build
# time and a surface to keep updated, and these binaries must start in a few
# milliseconds, which is the only reason they exist.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not taste: without it `1787052662.1803281` parses back
# as `1787052662.180328`, half an ULP, and every comparison with an instant
# read and rewritten diverges. The state files all go through this.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
