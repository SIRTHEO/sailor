[workspace]
resolver = "2"
members = ["crates/hook-io", "crates/guards", "crates/claude-hooks"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

# Dipendenze tenute al minimo di proposito: ogni crate in più è tempo di
# compilazione e superficie da aggiornare, e questi binari devono partire in
# pochi millisecondi — è l'unica ragione per cui esistono.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
