# La batteria gira su una macchina che non è quella di chi ha scritto il codice.
#
# **PERCHÉ ESISTE, E NON È «PERCHÉ SI USA».** Fino al 01/09/2026 il verde di
# questo progetto esisteva solo sul portatile di chi lavora. Il guasto 43 è
# esattamente questo: l'inventario rispondeva «zero repo» **su qualunque altra
# macchina**, e qui non si vedeva perché quelle cartelle esistevano. Una
# batteria che gira in un posto solo non distingue «il codice è giusto» da «la
# macchina è quella giusta».
#
# **NIENTE CACHE FRA LE CORSE, PER ORA.** Una cache che riporta artefatti da una
# corsa precedente rende possibile un verde che dipende da cosa c'era prima —
# ed è la stessa famiglia di difetto che questo file esiste per scoprire.
# Quando la lentezza darà fastidio si aggiungerà una cache **dichiarando** cosa
# viene riportato.
#
# **LA PRIMA STESURA DI QUESTO FILE NON HA MAI FATTO PARTIRE LA BATTERIA, ED È
# IL GUASTO DA CUI VIENE LA FORMA DI ADESSO.** Metteva `cargo fmt --check` e
# `cargo clippy -- -D warnings` **prima** di `cargo test`, come si legge in
# mezzo mondo. Misurato il 01/09/2026 su questo codice: la forma vuole
# cambiare **445 punti in 80 file**, i sospetti sono **173**. Nessuno dei due
# è un difetto — sono il divario fra le abitudini di rustfmt e uno stile
# scritto a mano — ma tutti e due cadono in dieci secondi, e cadendo per primi
# **hanno impedito alla batteria di girare in tutte e tre le corse fatte**.
# Il risultato era un semaforo sempre rosso che non diceva niente su ciò che
# conta, cioè se il codice passa le prove su una macchina pulita. Un controllo
# che grida al lupo ogni volta viene spento dopo tre volte, e allora non
# protegge più niente: è la stessa ragione per cui il flusso `pubblica` cerca
# la **forma** di un segreto e non l'elenco dei prefissi.
#
# Da qui la divisione: **un lavoro che ferma** (le prove) e **un lavoro che
# conta** (lo stile). I due numeri dello stile finiscono nel riepilogo a ogni
# corsa, così sono davanti agli occhi e si vede se crescono. Non fermano
# nessuno finché non c'è una decisione presa: se un giorno si decide che
# Sailor adotta rustfmt, quel lavoro diventa un cancello; se si decide di no,
# si toglie la misura invece di lasciarla lì a fare rumore.

name: la batteria

on:
  push:
    branches: [main, sorgenti]
  pull_request:
  workflow_dispatch:

# Una corsa per ramo: spingere due volte di fila non deve pagare due volte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prove:
    name: prove del workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: la versione di Rust che il manifesto dichiara
        # Non «l'ultima»: quella scritta in `rust-version`. Compilare con una
        # più nuova di quella dichiarata vuol dire non accorgersi del giorno in
        # cui il codice smette di stare dentro il minimo promesso.
        run: |
          rustup toolchain install "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" --profile minimal
          rustup default "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          rustc --version

      - name: la batteria
        # **MAI INCANALATA.** `cargo test | tail` esce 0 con la batteria rossa:
        # l'uscita di una pipeline è dell'ultimo comando. Si scrive su file e si
        # legge quello — è il guasto sul quale ci sono cascati in due lo stesso
        # giorno.
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/batteria.txt"

      - name: il riepilogo, dove lo si legge senza aprire i registri
        if: always()
        run: |
          {
            echo "### La batteria"
            echo
            echo '```'
            grep -E '^test result:' "$RUNNER_TEMP/batteria.txt" \
              | awk -F'[ .;]+' '{ok+=$4; ko+=$6} END {print "passate: "ok"   fallite: "ko}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  stile:
    name: il debito di stile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **QUESTO LAVORO NON FERMA NESSUNO, E LO DICE.** Conta due divari e li
    # scrive nel riepilogo. Il giorno in cui uno dei due arriva a zero — o si
    # decide una soglia che può solo scendere — questa riga si toglie e il
    # lavoro diventa un cancello vero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: la versione di Rust che il manifesto dichiara
        run: |
          rustup toolchain install "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" --profile minimal --component rustfmt,clippy
          rustup default "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"

      - name: la forma, contata
        # `|| true` perché qui il non-zero è il dato, non il guasto: rustfmt
        # esce 1 esattamente quando ha qualcosa da dire.
        run: cargo fmt --all -- --check > "$RUNNER_TEMP/forma.txt" 2>&1 || true

      - name: i sospetti, contati
        # Senza `-D warnings`: si vuole il numero, non la caduta. E niente
        # `RUSTFLAGS` globale — quello arriva **anche alle dipendenze**, e una
        # dipendenza che avvisa diventerebbe il nostro rosso senza dire niente
        # sul nostro codice.
        run: cargo clippy --workspace --all-targets > "$RUNNER_TEMP/sospetti.txt" 2>&1 || true

      - name: i due numeri, dove si vedono senza aprire i registri
        if: always()
        run: |
          forma=$(grep -c '^Diff in' "$RUNNER_TEMP/forma.txt" || true)
          file=$(grep '^Diff in' "$RUNNER_TEMP/forma.txt" | sed 's/:[0-9]*:$//' | sort -u | wc -l || true)
          sospetti=$(grep -cE '^warning: ' "$RUNNER_TEMP/sospetti.txt" || true)
          {
            echo "### Il debito di stile"
            echo
            echo "| divario | quanto |"
            echo "| --- | --- |"
            echo "| punti su cui rustfmt non è d'accordo | ${forma:-0} (in ${file:-0} file) |"
            echo "| sospetti di clippy | ${sospetti:-0} |"
            echo
            echo "Nessuno dei due ferma la pubblicazione. Servono a vedere se crescono."
          } >> "$GITHUB_STEP_SUMMARY"

  finestra:
    name: prove della finestra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: le dipendenze, esattamente quelle dichiarate
        working-directory: desktop
        run: npm ci
      - name: i tipi e le prove
        # `npm run build` fa `tsc --noEmit && vitest run && vite build`: i tre
        # gesti insieme, che è come vengono eseguiti davvero.
        working-directory: desktop
        run: npm run build
