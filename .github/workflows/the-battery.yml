# The battery runs on a machine that is not the one the code was written on.
#
# **WHY THIS EXISTS, AND IT IS NOT "BECAUSE EVERYONE HAS ONE".** Until
# 2026-09-01 this project's green existed only on the laptop of whoever was
# working. Fault 43 is exactly that: the inventory answered "zero repos" **on
# any other machine**, and nobody could see it here because those directories
# happened to exist. A battery that runs in one place cannot tell "the code is
# right" from "the machine is the right one".
#
# **NO CACHE BETWEEN RUNS, FOR NOW.** A cache that carries artefacts over from
# an earlier run makes a green possible that depends on what was there before —
# the same family of defect this file exists to catch. When the slowness starts
# to hurt, a cache goes in **declaring** what it carries over.
#
# **THE FIRST DRAFT OF THIS FILE NEVER LET THE BATTERY START, AND THAT IS THE
# FAULT THE PRESENT SHAPE COMES FROM.** It put `cargo fmt --check` and
# `cargo clippy -- -D warnings` **before** `cargo test`, the way half the world
# writes it. Measured on this code: rustfmt wants to change **415 places
# across 90 files**, clippy has **199** suspicions. Neither is a defect —
# they are the gap between rustfmt's habits and a hand-broken style —
# but both fall in ten seconds, and falling first they **kept the battery from
# running in all three runs there had been**. The result was a light that was
# always red and said nothing about the thing that matters: whether the code
# passes its tests on a clean machine. A check that cries wolf every time gets
# switched off after three times, and then it protects nothing at all — the
# same reason the `pubblica` flow looks for the **shape** of a secret rather
# than a list of prefixes.
#
# Hence the split: **a job that stops you** (the tests) and **a job that
# counts** (the style). The two style numbers land in the run summary every
# time, so they are in front of your eyes and it shows when they grow. They
# stop nobody until a decision is taken: if one day Sailor adopts rustfmt, that
# job becomes a real gate; if it decides not to, the measurement is removed
# rather than left there making noise.
#
# **THE PROSE HERE IS ENGLISH AND THE REST OF THE PROJECT'S IS NOT**, which is
# deliberate and was decided by Theo on 2026-09-01: what a stranger reads —
# the CI, the README, the messages a user of the tool sees — is in English;
# comments inside the code and everything under `docs/` stay in Italian. The
# occasion was this very file: it went out with three job keys in Italian, and
# `identifiers_are_in_english` never noticed **because it only reads Rust
# sources**. It reads workflow job keys now.

name: the battery

on:
  push:
    branches: [main, sorgenti]
  pull_request:
  workflow_dispatch:

# One run per branch: pushing twice in a row must not pay twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # **JOB KEYS ARE IDENTIFIERS.** Not a nuance: `needs:`, `jobs.<id>` in the
  # API and `gh run` filters all read this word. It is the same line of
  # `AGENTS.md` that lists "JSON keys" — what a machine reads is English.
  tests:
    name: workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: the Rust version the manifest declares
        # Not "the latest": the one written in `rust-version`. Building with a
        # newer one than declared means never noticing the day the code stops
        # fitting inside the minimum it promises.
        run: |
          rustup toolchain install "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" --profile minimal
          rustup default "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          rustc --version

      - name: the battery
        # **NEVER PIPED.** `cargo test | tail` exits 0 with a red battery: a
        # pipeline's exit code is the last command's. Write to a file and read
        # that — it is the fault two people fell into on the same day.
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/battery.txt"

      - name: the summary, readable without opening the logs
        if: always()
        run: |
          {
            echo "### The battery"
            echo
            echo '```'
            grep -E '^test result:' "$RUNNER_TEMP/battery.txt" \
              | awk -F'[ .;]+' '{ok+=$4; ko+=$6} END {print "passed: "ok"   failed: "ko}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # **THE LINTS THAT NAME A DEFECT STOP THE BATTERY.** `correctness` is code
  # that is wrong; `suspicious` is code that is very likely wrong. The other
  # groups stay a counted debt in the job below.
  gate:
    name: clippy gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: the Rust version the manifest declares
        run: |
          rustup toolchain install "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" --profile minimal --component clippy
          rustup default "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"

      - name: correctness and suspicious are errors
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

  style:
    name: the style debt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **THIS JOB STOPS NOBODY, AND SAYS SO.** It counts two gaps and writes
    # them into the summary. The day either reaches zero — or a ceiling is
    # agreed that can only come down — this line goes and the job becomes a
    # real gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: the Rust version the manifest declares
        run: |
          rustup toolchain install "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" --profile minimal --component rustfmt,clippy
          rustup default "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"

      - name: formatting, counted
        # `|| true` because here a non-zero exit is the data, not the failure:
        # rustfmt exits 1 exactly when it has something to say.
        run: cargo fmt --all -- --check > "$RUNNER_TEMP/formatting.txt" 2>&1 || true

      - name: clippy, counted
        # No `-D warnings`: we want the number, not the fall. And no global
        # `RUSTFLAGS` — that reaches **dependencies too**, and a dependency
        # that warns would become our red while saying nothing about our code.
        run: cargo clippy --workspace --all-targets > "$RUNNER_TEMP/clippy.txt" 2>&1 || true

      - name: the two numbers, visible without opening the logs
        if: always()
        run: |
          places=$(grep -c '^Diff in' "$RUNNER_TEMP/formatting.txt" || true)
          files=$(grep '^Diff in' "$RUNNER_TEMP/formatting.txt" | sed 's/:[0-9]*:$//' | sort -u | wc -l || true)
          suspicions=$(grep -cE '^warning: ' "$RUNNER_TEMP/clippy.txt" || true)
          {
            echo "### The style debt"
            echo
            echo "| gap | how much |"
            echo "| --- | --- |"
            echo "| places rustfmt disagrees with | ${places:-0} (across ${files:-0} files) |"
            echo "| clippy suspicions | ${suspicions:-0} |"
            echo
            echo "Neither blocks publishing. They are here so it shows when they grow."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # **`desktop/src-tauri` DECLARES A WORKSPACE OF ITS OWN, SO
      # `cargo test --workspace` NEVER SEES IT.** Twenty-three tests sat outside
      # every gate, and one of them was red in silence — it looked for a command
      # line copied by hand into a manual, and the copy had drifted. A test
      # nobody runs is a test that stops being true without telling anybody.
      - name: the system libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: the Rust version the manifest declares
        run: |
          rustup toolchain install "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" --profile minimal
          rustup default "$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"

      - name: the shell's own battery
        run: |
          set -o pipefail
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --no-fail-fast 2>&1 \
            | tee "$RUNNER_TEMP/shell.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: the dependencies, exactly the ones declared
        working-directory: desktop
        run: npm ci
      - name: types and tests
        # `npm run build` runs `tsc --noEmit && vitest run && vite build`: the
        # three gestures together, which is how they actually run.
        working-directory: desktop
        run: npm run build
