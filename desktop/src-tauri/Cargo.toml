[package]
name = "sailor-desktop"
version = "0.1.0"
description = "La finestra di Sailor: la tela dei flussi, in un programma vero."
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# La finestra chiede i flussi al motore invece di rileggerli per conto suo:
# `load_flow_registry` sa già distinguere un flusso valido da uno rotto e
# porta il motivo del rifiuto. Una seconda lettura qui sarebbe la quarta
# copia della stessa conoscenza — dopo `crates/flow`, `crates/ui` e
# `desktop/src/flow.ts` — e la prima a divergere in silenzio.
ui = { path = "../../crates/ui" }
flow = { path = "../../crates/flow" }

# Per rifiutare, al salvataggio, un flusso con un'azione che il motore non sa
# eseguire — la stessa verifica di `sailor flow check`
# (`crates/sailor/src/flow_cmd.rs`), qui richiamata via `register_default` /
# `register_store`, non riscritta.
actions = { path = "../../crates/actions" }
ledger = { path = "../../crates/ledger" }

# Quali azioni sa eseguire il motore: la stessa lista che usa il terminale.
# Averla in copia qui ha fatto girare lo stesso flusso in due modi diversi a
# seconda di chi lo lanciava — l'ultima volta il 30/08/2026, in silenzio.
registry = { path = "../../crates/registry" }

# Gli alberi di lavoro: la stessa conoscenza che legge `sailor worktree`, non
# una seconda lettura di `git worktree list` scritta qui.
workspace = { path = "../../crates/workspace" }

# I comandi della riga di comando, per mostrarli nella finestra senza
# ricopiarli. `crates/sailor` è diventato lib+bin il 01/09/2026 proprio per
# questo: l'alternativa era una pagina d'aiuto in TypeScript che diverge dal
# binario alla prima opzione aggiunta — il guasto 10, alla sesta occorrenza.
sailor = { path = "../../crates/sailor" }

# Le frasi, in una lingua o nell'altra. La tabella dei comandi porta la chiave
# e non la riga: senza il catalogo la finestra mostrerebbe la chiave.
catalogue = { path = "../../crates/catalogue" }

# Per dire, dentro la finestra, che la ricostruzione è fallita — guasto 11. È
# lo stesso crate che tiene acceso questo programma da fuori: il formato dello
# stato è dichiarato una volta sola, o supervisore e finestra si scriverebbero
# due JSON che divergono al primo campo aggiunto.
supervisor = { path = "../../crates/supervisor" }

# Per far partire un flusso che comincia con un nodo di innesco: l'azione
# `trigger` vive in un crate a sé, e un registro che non la contiene rifiuta il
# flusso con «azione sconosciuta» al momento del lancio.
trigger = { path = "../../crates/trigger" }

# Per rispondere alla finestra quando chiede «cosa posso usare qui»: CLI di
# intelligenza artificiale, server MCP, strumenti. L'elenco di cosa cercare è un
# dato del crate, non codice, e chi installa qualcosa di nuovo lo dichiara in un
# file invece di aspettare una versione nuova del programma.
toolbox = { path = "../../crates/toolbox" }
profiles = { path = "../../crates/profiles" }
models = { path = "../../crates/models" }

# Il motore dei terminali. La finestra non ne contiene nemmeno una riga: apre,
# scrive, ridimensiona e chiude passando di qui, e riceve l'uscita mentre esce.
# È il crate che si prova con `cargo test -p terminal`, cioè senza aprire
# niente — ed è il motivo per cui vive fuori da questa cartella.
terminal = { path = "../../crates/terminal" }

# Per portare alla finestra i byte che escono da uno pseudo-terminale. Non è una
# dipendenza nuova per questo albero: `base64 0.22.1` è già in `Cargo.lock`,
# tirata da Tauri, quindi dichiararla qui non scarica e non compila niente in
# più. L'alternativa era scriversi un codificatore in casa: cinquanta righe di
# uno standard, con l'unico guadagno di non nominarlo.
base64 = "0.22"

# Per dire, dentro la finestra, cosa è installato su questa macchina:
# competenze, agenti, comandi, regole, ganci. Le radici da guardare stanno nel
# crate e non nei chiamanti, perché la riga di comando e la finestra dicano lo
# stesso numero sulla stessa macchina.
inventory = { path = "../../crates/inventory" }

# FUORI DAL WORKSPACE, DI PROPOSITO. Un `[workspace]` vuoto stacca questo crate
# da quello alla radice, e non è pigrizia: `sailor release` esegue
# `cargo test --release --workspace` per **qualunque** bersaglio, quindi da
# membro questa finestra si tirerebbe dietro WebKit e qualche centinaio di crate
# a ogni rilascio di `hooks` o di `notte` — su una macchina dove il governo della
# memoria ferma già le compilazioni ordinarie. La finestra ha il suo ciclo di
# vita: si compila quando la si vuole vedere.
[workspace]

# Gli stessi interruttori della radice: un binario che deve aprirsi subito.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
