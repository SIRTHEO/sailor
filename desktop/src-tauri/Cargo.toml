[package]
name = "sailor-desktop"
version = "0.1.0"
description = "The window of Sailor: the flows, their steps and the agents in them, as a real program."
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SIRTHEO/sailor"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The window asks the engine for the flows instead of re-reading them itself:
# `load_flow_registry` already tells a valid flow from a broken one and
# carries the reason. A second reading here would be one more copy of the
# same knowledge, and the first to diverge in silence.
ui = { path = "../../crates/ui" }
flow = { path = "../../crates/flow" }

# To refuse, on save, a flow with an action the engine cannot run: the same
# check as `sailor flow check`, called through `register_default` and
# `register_store`, not rewritten.
actions = { path = "../../crates/actions" }
ledger = { path = "../../crates/ledger" }
# The terminals Sailor tracks: from here it knows which trees it has worked
# in, which is how a project enters the list without anybody typing `init`.
sessions = { path = "../../crates/sessions" }

# Which actions the engine can run: the same list the command line uses. A
# copy here once ran the same flow in two ways depending on who launched it.
registry = { path = "../../crates/registry" }

# The worktrees: the same knowledge `sailor worktree` reads, not a second
# reading of `git worktree list` written here.
workspace = { path = "../../crates/workspace" }

# The commands of the command line, shown in the window without a copy. The
# alternative was a help page in TypeScript that diverges from the binary at
# the first option added; see fault 10.
sailor = { path = "../../crates/sailor" }

# The sentences, in one language or the other. The table of commands carries
# the key and not the line: without the catalogue the window would show the key.
catalogue = { path = "../../crates/catalogue" }

# To say, inside the window, that the rebuild failed; see fault 11. The same
# crate keeps this program alive from outside: the state's format is declared
# once, or supervisor and window would write two JSONs that diverge at the
# first field added.
supervisor = { path = "../../crates/supervisor" }

# To start a flow that begins with a trigger node: the `trigger` action lives
# in a crate of its own, and a registry without it refuses the flow with
# «unknown action» at launch.
trigger = { path = "../../crates/trigger" }

# To answer the window when it asks «what can I use here»: AI command lines,
# MCP servers, tools. What to look for is data of the crate, not code, and
# whoever installs something new declares it in a file instead of waiting for
# a new version of the program.
toolbox = { path = "../../crates/toolbox" }
profiles = { path = "../../crates/profiles" }
models = { path = "../../crates/models" }
faults = { path = "../../crates/faults" }

# The terminal engine. The window holds not one line of it: it opens, writes,
# resizes and closes through here, and receives the output as it comes. It is
# the crate tested with `cargo test -p terminal`, without opening anything,
# which is why it lives outside this directory.
terminal = { path = "../../crates/terminal" }

# To bring the window the bytes leaving a pseudo-terminal. Not a new
# dependency for this tree: `base64` is already in the lock file, pulled by
# Tauri, so declaring it here downloads and builds nothing more.
base64 = "0.22"

# To say, inside the window, what is installed on this machine: skills,
# agents, commands, rules, hooks. The roots to look at live in the crate and
# not in the callers, so the command line and the window say the same number
# on the same machine.
inventory = { path = "../../crates/inventory" }

# Outside the workspace, on purpose. An empty `[workspace]` detaches this crate
# from the root one: `sailor release` runs `cargo test --release --workspace`
# for every target, so as a member this window would pull WebKit and a few
# hundred crates into every release, on a machine where memory governance
# already stops ordinary builds. The window is built when one wants to see it.
[workspace]

# The same switches as the root: a binary that must open at once.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
